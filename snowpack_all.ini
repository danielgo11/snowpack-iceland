PROF_DAYS_BETWEEN = 0.041666
PROF_ID_OR_MK = ID
PROF_AGE_OR_DATE = AGE
HARDNESS_IN_NEWTON = FALSE
CLASSIFY_PROFILE = TRUE
TS_WRITE = TRUE
TS_FORMAT = SMET

[Interpolations1D]
